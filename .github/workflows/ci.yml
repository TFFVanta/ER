name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
      - "codex/**"

jobs:
  portal-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run portal tests
        run: npm run portal:test

      - name: Build portal
        run: npm run portal:build

      - name: Archive frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: mingo-center-dist
          path: dist
