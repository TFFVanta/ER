name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional release ID or commit SHA to restore
        required: false
        default: ""

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mingo.center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Roll back Hostinger release
        env:
          ROLLBACK_RELEASE_ID: ${{ github.event.inputs.release_id }}
          HOSTINGER_DEPLOYMENT_MODE: ${{ vars.HOSTINGER_DEPLOYMENT_MODE }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_DEPLOYMENT_ROOT: ${{ secrets.HOSTINGER_DEPLOYMENT_ROOT }}
          HOSTINGER_WEB_ROOT: ${{ secrets.HOSTINGER_WEB_ROOT }}
        run: node tooling/deploy/hostinger-rollback.mjs

      - name: Verify production health
        env:
          HEALTHCHECK_URL: https://mingo.center/healthz.json
        run: node tooling/check-frontend-health.mjs
